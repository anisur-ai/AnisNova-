<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="AnisNova PDF Merge — Merge multiple PDF files into one PDF online.">

    <title>PDF Merge — AnisNova</title>

    <!-- PDF-LIB -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070b16;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.08);
            background: rgba(7,11,22,.9);
        }

        .logo {
            text-decoration: none;
            color: white;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span {
            color: #53e6ff;
        }

        .back {
            color: #aab4c8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: auto;
            padding: 70px 0;
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            border-radius: 20px;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
        }

        h1 {
            font-size: clamp(34px, 7vw, 55px);
            margin-bottom: 15px;
        }

        .hero p {
            color: #9da8bc;
            line-height: 1.6;
        }

        .card {
            background: linear-gradient(145deg,#101728,#141d31);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            padding: 25px;
        }

        .upload {
            min-height: 220px;
            border: 2px dashed rgba(83,230,255,.35);
            border-radius: 17px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 25px;

            cursor: pointer;

            background: rgba(255,255,255,.02);
        }

        .upload:hover {
            background: rgba(255,255,255,.05);
            border-color: rgba(83,230,255,.7);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .upload strong {
            font-size: 17px;
        }

        .upload span {
            margin-top: 8px;
            color: #7f8ba1;
            font-size: 13px;
        }

        #fileInput {
            display: none;
        }

        #fileList {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 13px 15px;
            margin-bottom: 9px;

            border-radius: 11px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.06);
        }

        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
            font-size: 14px;
        }

        .remove {
            border: none;
            background: transparent;
            color: #ff7d8d;
            cursor: pointer;
            font-size: 18px;
        }

        .merge-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: white;
            color: #070b16;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;
        }

        .merge-btn:hover {
            transform: translateY(-1px);
        }

        .merge-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            margin-top: 18px;
            color: #8f9bb0;
            font-size: 14px;
            min-height: 20px;
        }

        .download {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 14px;

            text-align: center;
            text-decoration: none;

            border-radius: 12px;

            background: #53e6ff;
            color: #071019;

            font-weight: 800;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            color: #6f7b90;
            font-size: 12px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 35px 20px;
            color: #68748a;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 45px 0;
            }

            .card {
                padding: 16px;
            }

            .upload {
                min-height: 190px;
            }

            .navbar {
                padding: 0 5%;
            }

        }

    </style>
</head>


<body>


<header class="navbar">

    <a href="../index.html" class="logo">
        <span>ANIS</span>NOVA
    </a>

    <a href="../index.html" class="back">
        ← Back to Tools
    </a>

</header>


<main class="container">


    <section class="hero">

        <div class="icon">
            📄
        </div>

        <h1>
            PDF Merge
        </h1>

        <p>
            Combine multiple PDF files into
            one PDF document.
        </p>

    </section>


    <section class="card">


        <label class="upload" for="fileInput">

            <div class="upload-icon">
                📁
            </div>

            <strong>
                Select PDF files
            </strong>

            <span>
                You can select multiple PDF files
            </span>

        </label>


        <input
            type="file"
            id="fileInput"
            accept="application/pdf,.pdf"
            multiple
        >


        <div id="fileList"></div>


        <button
            id="mergeBtn"
            class="merge-btn"
            disabled
        >
            Merge PDFs
        </button>


        <div
            id="status"
            class="status"
        ></div>


        <a
            id="downloadBtn"
            class="download"
            download="AnisNova-Merged.pdf"
        >
            ⬇ Download Merged PDF
        </a>


        <p class="note">
            Your selected files are processed in your browser.
            They are not uploaded to an AnisNova server.
        </p>

    </section>

</main>


<footer>

    © <span id="year"></span> AnisNova —
    Smart Tools. Simple Solutions.

</footer>


<script>

    const fileInput =
        document.getElementById("fileInput");

    const fileList =
        document.getElementById("fileList");

    const mergeBtn =
        document.getElementById("mergeBtn");

    const status =
        document.getElementById("status");

    const downloadBtn =
        document.getElementById("downloadBtn");


    let selectedFiles = [];


    /* =========================
       FILE SELECTION
    ========================== */

    fileInput.addEventListener(
        "change",
        function () {

            selectedFiles =
                Array.from(this.files);

            renderFiles();

        }
    );


    /* =========================
       SHOW FILES
    ========================== */

    function renderFiles() {

        fileList.innerHTML = "";

        selectedFiles.forEach(
            (file, index) => {

                const item =
                    document.createElement("div");

                item.className =
                    "file-item";


                const name =
                    document.createElement("div");

                name.className =
                    "file-name";

                name.textContent =
                    `${index + 1}. ${file.name}`;


                const remove =
                    document.createElement("button");

                remove.className =
                    "remove";

                remove.textContent =
                    "×";

                remove.title =
                    "Remove file";


                remove.onclick =
                    function () {

                        selectedFiles.splice(
                            index,
                            1
                        );

                        renderFiles();

                    };


                item.appendChild(name);

                item.appendChild(remove);

                fileList.appendChild(item);

            }
        );


        mergeBtn.disabled =
            selectedFiles.length < 2;

    }


    /* =========================
       MERGE PDFs
    ========================== */

    mergeBtn.addEventListener(
        "click",
        async function () {

            if (selectedFiles.length < 2) {

                status.textContent =
                    "Please select at least 2 PDF files.";

                return;

            }


            try {

                mergeBtn.disabled = true;

                downloadBtn.style.display =
                    "none";

                status.textContent =
                    "Merging PDFs...";


                const mergedPdf =
                    await PDFLib.PDFDocument.create();


                for (
                    let i = 0;
                    i < selectedFiles.length;
                    i++
                ) {

                    status.textContent =
                        `Processing file ${i + 1} of ${selectedFiles.length}...`;


                    const bytes =
                        await selectedFiles[i]
                            .arrayBuffer();


                    const pdf =
                        await PDFLib.PDFDocument
                            .load(bytes);


                    const pages =
                        await mergedPdf.copyPages(
                            pdf,
                            pdf.getPageIndices()
                        );


                    pages.forEach(
                        page => {

                            mergedPdf.addPage(
                                page
                            );

                        }
                    );

                }


                status.textContent =
                    "Creating merged PDF...";


                const finalBytes =
                    await mergedPdf.save();


                const blob =
                    new Blob(
                        [finalBytes],
                        {
                            type:
                                "application/pdf"
                        }
                    );


                const url =
                    URL.createObjectURL(blob);


                downloadBtn.href =
                    url;


                downloadBtn.style.display =
                    "block";


                status.textContent =
                    "✓ PDF merged successfully!";


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong. Please check your PDF files.";

            }


            mergeBtn.disabled = false;

        }
    );


    /* =========================
       YEAR
    ========================== */

    document.getElementById("year")
        .textContent =
        new Date().getFullYear();

</script>

</body>
  </html>
