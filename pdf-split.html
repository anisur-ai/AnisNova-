<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="AnisNova PDF Split — Split PDF pages into a new PDF online.">

<title>PDF Split — AnisNova</title>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b16;
    color:white;
    min-height:100vh;
}

.navbar{
    height:70px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,11,22,.9);
}

.logo{
    color:white;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#53e6ff;
}

.back{
    color:#aab4c8;
    text-decoration:none;
    font-size:14px;
}

.container{
    width:92%;
    max-width:850px;
    margin:auto;
    padding:65px 0;
}

.hero{
    text-align:center;
    margin-bottom:35px;
}

.icon{
    width:70px;
    height:70px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    border-radius:20px;
    background:rgba(255,255,255,.06);
}

h1{
    font-size:clamp(35px,7vw,55px);
    margin-bottom:15px;
}

.hero p{
    color:#9da8bc;
    line-height:1.6;
}

.card{
    background:linear-gradient(145deg,#101728,#141d31);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:25px;
}

.upload{
    min-height:210px;
    border:2px dashed rgba(83,230,255,.35);
    border-radius:17px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    cursor:pointer;
}

.upload:hover{
    background:rgba(255,255,255,.04);
    border-color:rgba(83,230,255,.7);
}

.upload-icon{
    font-size:40px;
    margin-bottom:12px;
}

.upload span{
    color:#7f8ba1;
    font-size:13px;
    margin-top:8px;
}

#fileInput{
    display:none;
}

.options{
    margin-top:20px;
}

label{
    display:block;
    color:#aab4c8;
    font-size:13px;
    margin-bottom:8px;
}

input[type="text"]{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:white;
    outline:none;
}

input[type="text"]:focus{
    border-color:#53e6ff;
}

.split-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:white;
    color:#070b16;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.split-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.status{
    text-align:center;
    margin-top:18px;
    color:#8f9bb0;
    font-size:14px;
    min-height:20px;
}

.download{
    display:none;
    width:100%;
    margin-top:12px;
    padding:14px;
    text-align:center;
    text-decoration:none;
    border-radius:12px;
    background:#53e6ff;
    color:#071019;
    font-weight:800;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#6f7b90;
    font-size:12px;
    line-height:1.6;
}

footer{
    text-align:center;
    padding:35px 20px;
    color:#68748a;
    font-size:12px;
}

@media(max-width:600px){
    .container{
        padding:45px 0;
    }

    .card{
        padding:16px;
    }
}
</style>
</head>

<body>

<header class="navbar">

<a href="index.html" class="logo">
<span>ANIS</span>NOVA
</a>

<a href="index.html" class="back">
← Back to Tools
</a>

</header>


<main class="container">

<section class="hero">

<div class="icon">✂️</div>

<h1>PDF Split</h1>

<p>
Extract selected pages from a PDF
into a new PDF file.
</p>

</section>


<section class="card">

<label class="upload" for="fileInput">

<div class="upload-icon">📁</div>

<strong>Select a PDF file</strong>

<span>
Choose one PDF to split
</span>

</label>


<input
type="file"
id="fileInput"
accept="application/pdf,.pdf"
>


<div class="options">

<label for="pages">
Pages to extract
</label>

<input
type="text"
id="pages"
placeholder="Example: 1,3,5-7"
>

</div>


<button
id="splitBtn"
class="split-btn"
disabled
>
Split PDF
</button>


<div id="status" class="status"></div>


<a
id="downloadBtn"
class="download"
download="AnisNova-Split.pdf"
>
⬇ Download Split PDF
</a>


<p class="note">
Example: entering 1,3,5-7 extracts pages
1, 3, 5, 6 and 7.
</p>

</section>

</main>


<footer>

© <span id="year"></span>
AnisNova — Smart Tools. Simple Solutions.

</footer>


<script>

const fileInput =
document.getElementById("fileInput");

const pagesInput =
document.getElementById("pages");

const splitBtn =
document.getElementById("splitBtn");

const status =
document.getElementById("status");

const downloadBtn =
document.getElementById("downloadBtn");

let selectedFile = null;


fileInput.addEventListener("change",function(){

    selectedFile = this.files[0];

    splitBtn.disabled = !selectedFile;

    downloadBtn.style.display = "none";

    status.textContent =
        selectedFile
        ? "✓ " + selectedFile.name + " selected."
        : "";

});


function parsePages(text,maxPages){

    const pages = new Set();

    const parts = text.split(",");

    for(const part of parts){

        const value = part.trim();

        if(!value) continue;

        if(value.includes("-")){

            const range = value.split("-");

            if(range.length !== 2){
                throw new Error("Invalid page range.");
            }

            let start = parseInt(range[0]);
            let end = parseInt(range[1]);

            if(
                isNaN(start) ||
                isNaN(end) ||
                start < 1 ||
                end < start ||
                end > maxPages
            ){
                throw new Error("Invalid page range.");
            }

            for(let i=start;i<=end;i++){
                pages.add(i);
            }

        }else{

            const page = parseInt(value);

            if(
                isNaN(page) ||
                page < 1 ||
                page > maxPages
            ){
                throw new Error("Invalid page number.");
            }

            pages.add(page);
        }
    }

    return Array.from(pages).sort(
        (a,b)=>a-b
    );
}


splitBtn.addEventListener("click",async function(){

    if(!selectedFile){
        return;
    }

    try{

        splitBtn.disabled = true;

        downloadBtn.style.display = "none";

        status.textContent =
            "Reading PDF...";


        const bytes =
            await selectedFile.arrayBuffer();


        const sourcePdf =
            await PDFLib.PDFDocument.load(bytes);


        const totalPages =
            sourcePdf.getPageCount();


        const pageNumbers =
            parsePages(
                pagesInput.value,
                totalPages
            );


        if(pageNumbers.length === 0){
            throw new Error(
                "Enter the pages you want to extract."
            );
        }


        status.textContent =
            "Creating new PDF...";


        const newPdf =
            await PDFLib.PDFDocument.create();


        const indexes =
            pageNumbers.map(
                page => page - 1
            );


        const copiedPages =
            await newPdf.copyPages(
                sourcePdf,
                indexes
            );


        copiedPages.forEach(
            page => newPdf.addPage(page)
        );


        const finalBytes =
            await newPdf.save();


        const blob =
            new Blob(
                [finalBytes],
                {
                    type:"application/pdf"
                }
            );


        const url =
            URL.createObjectURL(blob);


        downloadBtn.href = url;

        downloadBtn.style.display =
            "block";


        status.textContent =
            "✓ PDF split successfully!";


    }catch(error){

        status.textContent =
            "⚠ " + error.message;

    }

    splitBtn.disabled = false;

});


document.getElementById("year")
.textContent =
new Date().getFullYear();

</script>

</body>
  </html>
